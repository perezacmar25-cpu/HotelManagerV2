<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habitaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-4">

        <div class="row mb-4 align-items-center">
            <div class="col">
                <h4 class="fw-bold text-dark mb-0">Habitaciones disponibles</h4>
            </div>
            <div class="col-auto">
                <a th:href="@{/reserva/nueva}" class="btn btn-dark btn-sm rounded-0 text-uppercase fw-bold"
                    sec:authorize="hasRole('USER')">
                    ¡Reserva ya!
                </a>
                <a th:href="@{/login}" class="btn btn-dark btn-sm rounded-0 text-uppercase fw-bold"
                    sec:authorize="!isAuthenticated()">
                    Inicia sesión para reservar
                </a>
            </div>
        </div>

        <form th:action="@{/habitaciones}" method="get" class="row g-2 align-items-end mb-4 p-3 bg-light border">
            <div class="col-md-4">
                <label class="form-label small text-uppercase text-secondary mb-1">Entrada</label>
                <input type="date" name="fechaInicio" class="form-control rounded-0"
                       th:value="${fechaInicio}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label small text-uppercase text-secondary mb-1">Salida</label>
                <input type="date" name="fechaFin" class="form-control rounded-0"
                       th:value="${fechaFin}" required>
            </div>
            <div class="col-md-4">
                <button type="submit" class="btn btn-dark rounded-0 w-100 text-uppercase">Ver disponibilidad</button>
            </div>
        </form>

        <div th:if="${disponibles != null}" class="row g-4 justify-content-center">
            <div class="col-md-4" th:each="hab : ${habitaciones}">
                <div class="card border-0 shadow-sm rounded-0 h-100">
                    <img th:src="@{'/img/' + ${hab.tipo} + '.jpg'}"
                        class="card-img-top rounded-0 object-fit-cover" style="height:200px" alt="Habitación">
                    <div class="card-body p-4">
                        <h5 class="card-title text-uppercase fw-bold small" th:text="${hab.tipo}">Tipo</h5>
                        <hr class="my-2">
                        <div class="fw-semibold mb-2" th:text="${hab.precioNoche + '€/noche'}">0€</div>
                        <div th:if="${disponibles[hab.tipo] > 0}">
                            <span class="badge bg-success" th:text="${disponibles[hab.tipo] + ' disponibles'}"></span>
                        </div>
                        <div th:if="${disponibles[hab.tipo] == 0}">
                            <span class="badge bg-danger">Sin disponibilidad</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center mt-5" sec:authorize="hasRole('USER')">
            <a th:href="@{/reserva/nueva}" class="btn btn-dark rounded-0 px-5 py-2 text-uppercase fw-bold">
                ¡Reserva ya!
            </a>
        </div>

        <div class="text-center mt-5" sec:authorize="!isAuthenticated()">
            <a th:href="@{/login}" class="btn btn-dark rounded-0 px-5 py-2 text-uppercase fw-bold">
                Inicia sesión para reservar
            </a>
        </div>

		<div class="text-center mt-3">
		    <a th:href="@{/}" class="btn btn-outline-dark rounded-0 px-4">Volver al inicio</a>
		    <a th:href="@{/admin/admininicio}" class="btn btn-outline-dark rounded-0 px-4 ms-2"
		       sec:authorize="hasRole('ADMIN')">Volver al panel</a>
		</div>
    </div>
</body>
</html>

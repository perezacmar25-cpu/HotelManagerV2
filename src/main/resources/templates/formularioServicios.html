<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Servicios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: url('/img/spa.jpg') center / cover no-repeat fixed;
        }
        .overlay {
            min-height: 100vh;
            background: rgba(10, 8, 5, 0.65);
        }
    </style>
</head>
<body>
<div class="overlay d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-end">
            <div class="col-md-5">
                <div class="bg-white p-5 shadow-lg">

                    <p class="text-uppercase text-secondary small mb-1">Hospedium</p>
                    <h2 class="fw-light mb-1" style="font-family:Georgia,serif">Servicios extra</h2>
                    <p class="text-secondary small mb-4">Elige solo los servicios que quieras añadir.</p>

                    <form th:action="@{'/reserva/' + ${reserva.id} + '/servicios'}" method="post">

                        <div class="border mb-3">
                            <div class="row g-0 bg-light border-bottom py-2 px-3 small text-uppercase text-secondary">
                                <div class="col-8">Servicio</div>
                                <div class="col-4 text-end">Precio</div>
                            </div>

							
							<!--Lo de th:classappend es para que salga lo del masaje y el tratamiento facial 
								si la casilla spa está marcada-->
                            <div th:each="s : ${servicios}"
                                 class="servicio-linea row g-0 align-items-center border-bottom py-3 px-3"
                                 th:classappend="${s.nombre == 'Masaje spa' or s.nombre == 'Tratamiento facial'} ? ' d-none extra-spa' : ''">
                                <div class="col-8">
                                    <label class="d-flex align-items-center gap-2 mb-0">
                                        <input type="checkbox" name="serviciosIds" th:value="${s.id}"
                                               th:data-precio="${s.precio}" th:data-nombre="${s.nombre}">
                                        <span class="small fw-semibold" th:text="${s.nombre}"></span>
                                    </label>
                                </div>
                                <div class="col-4 text-end small text-secondary" th:text="${s.precio} + ' €'"></div>
                            </div>
                        </div>

                        <div id="resumenPrecio" class="alert alert-secondary small mb-3 d-none"></div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-dark rounded-0 text-uppercase" style="letter-spacing:.05em">Guardar servicios</button>
                            <a th:href="@{/reserva/exito}" class="btn btn-outline-secondary rounded-0">Finalizar sin servicios</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const checkboxes = document.querySelectorAll('[name="serviciosIds"]');
    const spaCheckbox = document.querySelector('[data-nombre="Spa"]');
    const extrasSpa = document.querySelectorAll('.extra-spa');
    const resumen = document.getElementById('resumenPrecio');

    function calcularServicios() {
        let totalServicios = 0;

        checkboxes.forEach(cb => {
            if (cb.checked) {
                totalServicios += parseFloat(cb.dataset.precio) || 0;
            }
        });

        if (totalServicios === 0) {
            resumen.classList.add('d-none');
            return;
        }

        resumen.classList.remove('d-none');
        resumen.innerHTML = `<strong>Total servicios: ${totalServicios.toFixed(2)} €</strong>`;
    }

    function mostrarExtrasSpa() {
        if (!spaCheckbox) {
            return;
        }

        extrasSpa.forEach(extra => {
            const checkbox = extra.querySelector('[name="serviciosIds"]');
            extra.classList.toggle('d-none', !spaCheckbox.checked);

            if (!spaCheckbox.checked) {
                checkbox.checked = false;
            }
        });

        calcularServicios();
    }

    checkboxes.forEach(cb => cb.addEventListener('change', calcularServicios));
    if (spaCheckbox) {
        spaCheckbox.addEventListener('change', mostrarExtrasSpa);
    }
</script>
</body>
</html>

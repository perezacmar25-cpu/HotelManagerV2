<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Reservas – Hospedium</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: url('/img/habitacion.jpg') center / cover no-repeat fixed;
        }
        .overlay {
            min-height: 100vh;
            background: rgba(10, 8, 5, 0.72);
        }
        .reserva-card {
            border-left: 4px solid #fff;
            transition: border-color .2s;
        }
        .reserva-card:hover {
            border-left-color: #aaa;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" th:href="@{/}">HOSPEDIUM</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto text-uppercase align-items-center gap-2">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                <li class="nav-item ms-2" sec:authorize="hasRole('USER')">
                    <a class="btn btn-outline-light btn-sm px-4 rounded-0" th:href="@{/reserva/nueva}">Nueva reserva</a>
                </li>
                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-danger btn-sm px-4 m-3 rounded-0">
                        Cerrar sesión
                    </button>
                </form>
            </ul>
        </div>
    </div>
</nav>

<div class="overlay py-5">
    <div class="container">

        <div class="mb-5">
            <p class="text-uppercase text-white-50 small mb-1">Hospedium</p>
            <h2 class="fw-light text-white mb-1" style="font-family:Georgia,serif">Mis reservas</h2>
            <p class="text-white-50 small">Bienvenido/a, <strong class="text-white" th:text="${nombreCliente}"></strong></p>
        </div>

        <div th:if="${#lists.isEmpty(reservas)}" class="bg-white p-5 text-center shadow-lg">
            <p class="text-secondary mb-3">Todavía no tienes ninguna reserva.</p>
            <a th:href="@{/reserva/nueva}" class="btn btn-dark rounded-0 text-uppercase px-5">
                Hacer una reserva
            </a>
        </div>

        <div th:unless="${#lists.isEmpty(reservas)}" class="row g-4">
            <div class="col-12" th:each="r : ${reservas}">
                <div class="bg-white p-4 shadow-lg reserva-card">
                    <div class="row align-items-center">

                        <div class="col-md-4 border-end pe-4 mb-3 mb-md-0">
                            <p class="text-uppercase text-secondary small mb-1">Estancia</p>
                            <div class="d-flex align-items-center gap-3">
                                <div class="text-center">
                                    <div class="fs-3 fw-bold" th:text="${#temporals.day(r.fechaInicio)}"></div>
                                    <div class="small text-uppercase text-secondary" th:text="${#temporals.monthName(r.fechaInicio)}"></div>
                                    <div class="small text-secondary" th:text="${#temporals.year(r.fechaInicio)}"></div>
                                </div>
                                <div class="text-secondary">al</div>
                                <div class="text-center">
                                    <div class="fs-3 fw-bold" th:text="${#temporals.day(r.fechaFin)}"></div>
                                    <div class="small text-uppercase text-secondary" th:text="${#temporals.monthName(r.fechaFin)}"></div>
                                    <div class="small text-secondary" th:text="${#temporals.year(r.fechaFin)}"></div>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 border-end px-4 mb-3 mb-md-0">
                            <p class="text-uppercase text-secondary small mb-1">Habitación(es)</p>
                            <div th:each="rh : ${r.listadoReservaHab}">
                                <span class="fw-semibold" th:text="${rh.habitacion.tipo}"></span>
                                <span class="text-secondary small ms-2" th:text="'Hab. ' + ${rh.habitacion.numero}"></span>
                            </div>
                            <p class="small text-secondary mt-1 mb-0" th:text="${r.numeroPersonas} + ' persona(s)'"></p>
                        </div>

                        <div class="col-md-4 ps-4">
                            <p class="text-uppercase text-secondary small mb-1">Total</p>
                            <div class="fs-4 fw-bold mb-2" th:text="${r.precioTotal} + ' €'"></div>
                            <div th:if="${not #lists.isEmpty(r.servicios)}">
                                <p class="text-uppercase text-secondary small mb-1">Servicios</p>
                                <div class="d-flex flex-wrap gap-1">
                                    <span th:each="s : ${r.servicios}"
                                          class="badge bg-dark rounded-0 fw-normal small"
                                          th:text="${s.nombre}"></span>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <div th:unless="${#lists.isEmpty(reservas)}" class="text-end mt-4">
            <a th:href="@{/reserva/nueva}" class="btn btn-outline-light rounded-0 text-uppercase px-5">
                + Nueva reserva
            </a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <meta charset="UTF-8">
    <title>Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container py-5 text-center">
        <div class="card shadow-sm p-5 mx-auto" style="max-width:500px">
            <h2 class="text-danger fw-light mb-3" th:text="${errorTitulo} ?: 'Ha ocurrido un error'"></h2>
            <p class="text-secondary" th:text="${errorMensaje} ?: 'Por favor, vuelve atrás e inténtalo de nuevo.'"></p>
            <a href="/" class="btn btn-dark rounded-0 mt-3">Volver al inicio</a>
        </div>
    </div>
</body>
</html>

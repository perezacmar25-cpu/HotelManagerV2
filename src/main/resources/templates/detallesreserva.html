<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de la Reserva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
    <script>
        function descargarPDF() {
            // Ocultamos el botón de descarga y los botones de volver para que no salgan en el documento final
            document.getElementById('btn-pdf').style.display = 'none';
            document.getElementById('botones-navegacion').style.display = 'none';

            const elemento = document.getElementById('contenido-reserva');
            
            const opciones = {
                margin:       10,
                filename:     'reserva_hospedium.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // Ejecuta la descarga y cuando termina vuelve a mostrar los botones en la pantalla web
            html2pdf().set(opciones).from(elemento).save().then(() => {
                document.getElementById('btn-pdf').style.display = 'block';
                document.getElementById('botones-navegacion').style.display = 'block';
            });
        }
    </script>
</head>

<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container py-5">
        <div class="card border-primary-subtle shadow-sm rounded-3" id="contenido-reserva">
            <div class="card-header bg-primary-subtle text-primary-emphasis fw-semibold py-3 d-flex justify-content-between align-items-center">
                <span>Detalles de la reserva</span>
                
                <button onclick="descargarPDF()" class="btn btn-sm btn-dark px-3" id="btn-pdf">
                    Descargar PDF
                </button>
            </div>
            <div class="card-body p-4">
                <h5 class="card-title mb-4">Reserva de <span class="fw-bold" th:text="${reserva.cliente.nombre}"></span></h5>
                
                <p class="card-text"><strong>Código:</strong> <span th:text="${reserva.codigo != null ? reserva.codigo : 'RES-' + reserva.id}"></span></p>
                <p class="card-text"><strong>DNI:</strong> <span th:text="${reserva.cliente.dni}"></span></p>
                <p class="card-text"><strong>Fecha de entrada:</strong> <span th:text="${reserva.fechaInicio}"></span></p>
                <p class="card-text"><strong>Fecha de salida:</strong> <span th:text="${reserva.fechaFin}"></span></p>
                <p class="card-text"><strong>Precio total:</strong> <span class="text-success fw-bold" th:text="${reserva.precioTotal} + ' €'"></span></p>
                <p class="card-text"><strong>Número de personas:</strong> <span th:text="${reserva.numeroPersonas}"></span></p>
                
                <p class="card-text"><strong>Habitación(es):</strong> 
                    <span th:each="rh : ${reserva.listadoReservaHab}" 
                          th:text="'Nº ' + ${rh.habitacion.numero} + ' (' + ${rh.habitacion.tipo} + ') '" 
                          class="badge bg-primary text-white me-1"></span>
                    <span th:if="${#lists.isEmpty(reserva.listadoReservaHab)}" class="text-secondary">Sin asignar</span>
                </p>
                
				<p class="card-text"><strong>Plan de comida:</strong>
				    <span th:if="${reserva.planComida != null}"
				          th:text="${#strings.replace(reserva.planComida.tipo.name(), '_', ' ')}"></span>
				    <span th:if="${reserva.planComida == null}" class="text-secondary">Sin régimen de comidas</span>
				</p>
                
                <p class="card-text"><strong>Servicios adicionales:</strong></p>
                <span th:if="${#lists.isEmpty(reserva.serviciosReservados)}" class="text-secondary d-block mb-3">Ninguno</span>
                <ul th:if="${not #lists.isEmpty(reserva.serviciosReservados)}" class="mb-4">
                    <li th:each="s : ${reserva.serviciosReservados}" th:text="${s.servicio.nombre}"></li>
                </ul>
                
                <div class="pt-3 border-top" id="botones-navegacion">
                    <a th:href="@{/reserva/nueva}" class="btn btn-primary px-4">Nueva reserva</a>
                    <a sec:authorize="hasRole('USER')" th:href="@{/misreservas}" class="btn btn-outline-secondary px-4">Volver</a>
                </div>
            </div>
        </div>
    </div>

	<footer th:replace="~{fragments/footer::footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: url('/img/recepcion.jpg') center / cover no-repeat fixed;
        }
        .overlay {
            min-height: 100vh;
            background: rgba(10, 8, 5, 0.60);
        }
    </style>
</head>
<body>
<div class="overlay d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-end">
            <div class="col-md-5">
                <div class="bg-white p-5 shadow-lg">

                    <p class="text-uppercase text-secondary small mb-1">Hospedium</p>
                    <h2 class="fw-light mb-4" style="font-family:Georgia,serif">Alta de huésped</h2>

                    <form th:action="@{/nuevo}" th:object="${cliente}" method="post">

                        <div class="mb-3">
                            <label class="form-label small text-uppercase text-secondary">DNI / Pasaporte</label>
                            <input type="text" class="form-control rounded-0 border-0 border-bottom" th:field="*{dni}" placeholder="DNI" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-uppercase text-secondary">Nombre completo</label>
                            <input type="text" class="form-control rounded-0 border-0 border-bottom" th:field="*{nombre}" placeholder="Nombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-uppercase text-secondary">Email</label>
                            <input type="email" class="form-control rounded-0 border-0 border-bottom" th:field="*{email}" placeholder="Correo">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-uppercase text-secondary">Teléfono</label>
                            <input type="text" class="form-control rounded-0 border-0 border-bottom" th:field="*{telefono}" placeholder="Teléfono">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-uppercase text-secondary">Usuario</label>
                            <input type="text" class="form-control rounded-0 border-0 border-bottom" th:field="*{username}" placeholder="Nombre de usuario" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-uppercase text-secondary">Contraseña</label>
                            <input type="password" class="form-control rounded-0 border-0 border-bottom" name="password" placeholder="Contraseña" required minlength="6">
                        </div>
                        <div class="mb-4">
                            <label class="form-label small text-uppercase text-secondary">Confirmar contraseña</label>
                            <input type="password" class="form-control rounded-0 border-0 border-bottom" name="confirmPassword" placeholder="Repetir contraseña" required minlength="6">
                        </div>

                        <div th:if="${error}" class="alert alert-danger small py-2 mb-3" th:text="${error}"></div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-dark rounded-0 text-uppercase" style="letter-spacing:.05em">Registrar</button>
                            <a th:href="@{/}" class="btn btn-outline-secondary rounded-0 btn-sm">Cancelar</a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

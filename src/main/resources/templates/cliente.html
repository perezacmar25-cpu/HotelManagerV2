<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-secondary-subtle min-vh-100 d-flex align-items-center justify-content-center">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-dark py-3">
                        <h4 class="text-white mb-0 text-center fw-light">Alta de Huésped</h4>
                    </div>

                    <div class="card-body p-4">
                        <form th:action="@{/nuevo}" th:object="${cliente}" method="post">

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-uppercase text-muted">DNI / Pasaporte</label>
                                <input type="text" class="form-control form-control-lg bg-light" th:field="*{dni}" placeholder="DNI" required />
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-uppercase text-muted">Nombre Completo</label>
                                <input type="text" class="form-control form-control-lg bg-light" th:field="*{nombre}" placeholder="Nombre" required />
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-uppercase text-muted">Correo Electrónico</label>
                                <input type="email" class="form-control form-control-lg bg-light" th:field="*{email}" placeholder="Correo" />
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-uppercase text-muted">Teléfono de Contacto</label>
                                <input type="text" class="form-control form-control-lg bg-light" th:field="*{telefono}" placeholder="Teléfono" />
                            </div>
							
							<div class="mb-3">
							    <label class="form-label small fw-bold text-uppercase text-muted">Nombre de Usuario</label>
							    <input type="text" class="form-control form-control-lg bg-light" th:field="*{username}" placeholder="Nombre de usuario" required />
							</div>

                     
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-uppercase text-muted">Contraseña</label>
                                <input type="password" class="form-control form-control-lg bg-light" name="password" placeholder="Contraseña" required minlength="6" />
                            </div>

                    
                            <div class="mb-4">
                                <label class="form-label small fw-bold text-uppercase text-muted">Confirmar Contraseña</label>
                                <input type="password" class="form-control form-control-lg bg-light" name="confirmPassword" placeholder="Repetir contraseña" required minlength="6" />
                            </div>


                            <div th:if="${error}" class="alert alert-danger py-2 small mb-3" role="alert">
                                <i class="bi bi-exclamation-circle me-1"></i>
                                <span th:text="${error}"></span>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-dark btn-lg shadow-sm">
                                    Registrar Cliente
                                </button>
								<a th:href="@{/}" class="btn btn-outline-secondary border-0 btn-sm">
								        Cancelar y volver
								    </a>
                            </div>

                        </form>
                    </div>
                </div>
                
            
            </div>
        </div>
    </div>

</body>
</html>

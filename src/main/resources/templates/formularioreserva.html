<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hospedium - Reserva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">

                <div class="card-header bg-primary text-white py-3">
                    <h5 class="mb-0 fw-normal">Formulario de reserva</h5>
                </div>

                <div class="card-body p-4">
                    <form th:action="@{/reserva/confirmar}" th:object="${reserva}" method="post">

                        <p class="text-uppercase text-secondary small fw-semibold mb-2">Datos del cliente</p>
                        <div class="mb-3">
                            <label class="form-label small">DNI del cliente</label>
                            <input type="text" th:field="*{cliente.dni}" class="form-control form-control-sm"
                                   placeholder="12345678A" required>
                        </div>

                        <hr>
                        <p class="text-uppercase text-secondary small fw-semibold mb-2">Estancia</p>

                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label small">Fecha de entrada</label>
                                <input type="date" th:field="*{fechaInicio}" class="form-control form-control-sm" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label small">Fecha de salida</label>
                                <input type="date" th:field="*{fechaFin}" class="form-control form-control-sm" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label small">Nº de personas</label>
                                <input type="number" th:field="*{numeroPersonas}" class="form-control form-control-sm"
                                       placeholder="1" min="1" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label small">Tipo de habitación</label>
                                <select name="tipoHabitacion" class="form-select form-select-sm" required>
                                    <option value="" disabled selected>Seleccione...</option>
                                    <option value="Individual">Individual — 55€/noche</option>
                                    <option value="Doble">Doble — 100€/noche</option>
                                    <option value="Suite">Suite — 155€/noche</option>
                                </select>
                            </div>
                        </div>

                        <hr>
                        <p class="text-uppercase text-secondary small fw-semibold mb-2">Servicios adicionales</p>

                        <div class="row g-2 mb-3">
                            <div th:each="servicio : ${servicios}" class="col-6">
                                <div class="d-flex align-items-center gap-2 border rounded p-2">
                                    <input type="checkbox" th:value="${servicio.id}" name="serviciosIds"
                                           th:id="${'serv-' + servicio.id}" class="form-check-input mt-0">
                                    <label th:for="${'serv-' + servicio.id}" class="form-check-label small flex-grow-1 mb-0"
                                           th:text="${servicio.nombre}"></label>
                                    <span class="text-muted small"
                                          th:text="${servicio.precio > 0 ? servicio.precio + '€' : 'Gratis'}"></span>
                                </div>
                            </div>
                        </div>

                        <hr>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-sm">Confirmar reserva</button>
                            <a href="/" class="btn btn-outline-secondary btn-sm">Cancelar</a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>

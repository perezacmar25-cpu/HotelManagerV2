<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Reserva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: url('/img/habitacion.jpg') center / cover no-repeat fixed;
        }
        .overlay {
            min-height: 100vh;
            background: rgba(10, 8, 5, 0.65);
        }
    </style>
</head>
<body>
<div class="overlay d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-end">
            <div class="col-md-5">
                <div class="bg-white p-5 shadow-lg">

                    <p class="text-uppercase text-secondary small mb-1">Hospedium</p>
                    <h2 class="fw-light mb-1" style="font-family:Georgia,serif">Nueva reserva</h2>
                    <p class="text-secondary small mb-4">Bienvenido, <strong th:text="${nombreCliente}"></strong></p>

                    <div th:if="${error}" class="alert alert-danger small" th:text="${error}"></div>

                    <form th:action="@{/reserva/confirmar}" th:object="${reserva}" method="post">
                        <input type="hidden" th:field="*{cliente.dni}">

                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label small text-uppercase text-secondary">Entrada</label>
                                <input type="date" th:field="*{fechaInicio}" class="form-control rounded-0 border-0 border-bottom" required>
                            </div>
                            <div class="col">
                                <label class="form-label small text-uppercase text-secondary">Salida</label>
                                <input type="date" th:field="*{fechaFin}" class="form-control rounded-0 border-0 border-bottom" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small text-uppercase text-secondary">Personas</label>
                            <input type="number" th:field="*{numeroPersonas}" min="1" class="form-control rounded-0 border-0 border-bottom" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small text-uppercase text-secondary">Tipo de habitación</label>
                            <select name="tipoHabitacion" class="form-select rounded-0" required>
                                <option value="" disabled selected>Seleccione...</option>
                                <option th:each="t : ${tiposHabitacion}" th:value="${t}" th:text="${t}"></option>
                            </select>
                        </div>

                        <p class="small text-uppercase text-secondary mb-2">Servicios adicionales</p>
                        <div class="row mb-4">
                            <div th:each="s : ${servicios}" class="col-6 mb-2">
                                <div class="border p-2 d-flex align-items-center gap-2">
                                    <input type="checkbox" name="serviciosIds" th:value="${s.id}">
                                    <span class="small" th:text="${s.nombre}"></span>
                                </div>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-dark rounded-0 text-uppercase" style="letter-spacing:.05em">Confirmar reserva</button>
                            <a href="/" class="btn btn-outline-secondary rounded-0">Cancelar</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

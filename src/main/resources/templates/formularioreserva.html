<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>Nueva Reserva</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body {
			min-height: 100vh;
			background: url('/img/habitacion.jpg') center / cover no-repeat fixed;
		}

		.overlay {
			min-height: calc(100vh - 56px);
			background: rgba(10, 8, 5, 0.65);
		}

		body.admin-reserva {
			background: #f8f9fa;
		}

		body.admin-reserva .overlay {
			background: transparent;
		}

		body.admin-reserva .formulario-admin {
			border: 1px solid #b6d4fe;
			border-radius: .5rem;
		}
	</style>
	<script th:src="@{/js/formularioreserva.js}" type="text/javascript" defer></script>
</head>

<body th:classappend="${#authorization.expression('hasRole(''ADMIN'')')} ? 'admin-reserva' : ''">
	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<div class="overlay d-flex align-items-center py-5">
		<div class="container">
			<!--Todo esto es para que el formulario de reserva salga con un estilo distinto depende de si es rol usuario o admin el que está logueado-->
			<div th:class="${#authorization.expression('hasRole(''ADMIN'')')} ? 'row justify-content-center' : 'row justify-content-end'">
				<div th:class="${#authorization.expression('hasRole(''ADMIN'')')} ? 'col-lg-8 col-xl-7' : 'col-md-5'">
					<div th:class="${#authorization.expression('hasRole(''ADMIN'')')} ? 'bg-white shadow-sm formulario-admin' : 'bg-white p-5 shadow-lg'">
						<div th:class="${#authorization.expression('hasRole(''ADMIN'')')} ? 'p-4 p-lg-5' : ''">

						<p class="text-uppercase text-secondary small mb-1">Hospedium</p>
						<h2 class="fw-light mb-1" style="font-family:Georgia,serif">Gestión reserva</h2>
						<p class="text-secondary small mb-4">Bienvenido, <strong th:text="${nombreCliente}"></strong>
						</p>

						<div th:if="${temporadas != null and !temporadas.isEmpty()}" class="alert alert-warning">
							<strong>Aviso:</strong> Las reservas en temporada alta tienen un precio superior:
							<ul>
								<li th:each="t : ${temporadas}" th:if="${t.multiplicador > 1}"
									th:text="${t.nombre} + ': del ' + ${t.fechaInicio} + ' al ' + ${t.fechaFin} + ' (' + ${t.multiplicador} + 'x)'">>
								</li>
							</ul>
						</div>

						<div th:if="${error}" class="alert alert-danger small" th:text="${error}"></div>

						<form th:action="${editandoReserva == true} ? @{/admin/editar/reserva/{id}(id=${reserva.id})} : @{/reserva/confirmar}" th:object="${reserva}" method="post">
							<input type="hidden" th:field="*{cliente.dni}">

							<div class="row mb-3">
								<div class="col">
									<label class="form-label small text-uppercase text-secondary">Entrada</label>
									<input type="date" th:field="*{fechaInicio}"
										th:min="${fechaMinima}"
										class="form-control rounded-0 border-0 border-bottom" required>
									<div class="text-danger small mt-1" th:if="${#fields.hasErrors('fechaInicio')}" th:errors="*{fechaInicio}"></div>
								</div>
								<div class="col">
									<label class="form-label small text-uppercase text-secondary">Salida</label>
									<input type="date" th:field="*{fechaFin}"
										th:min="${fechaMinima}"
										class="form-control rounded-0 border-0 border-bottom" required>
									<div class="text-danger small mt-1" th:if="${#fields.hasErrors('fechaFin')}" th:errors="*{fechaFin}"></div>
								</div>
							</div>

							<div class="mb-3">
								<label class="form-label small text-uppercase text-secondary">Personas</label>
								<input type="number" th:field="*{numeroPersonas}" min="1" max="4"
									class="form-control rounded-0 border-0 border-bottom" required>
								<div class="text-danger small mt-1" th:if="${#fields.hasErrors('numeroPersonas')}" th:errors="*{numeroPersonas}"></div>
							</div>

							<div class="mb-4">
								<label class="form-label small text-uppercase text-secondary">Tipo de habitación</label>
								<select name="tipoHabitacion" class="form-select rounded-0" required>
									<option value="" disabled th:selected="${tipoHabitacionSeleccionada == null}">Seleccione...</option>
									<option th:each="t : ${tiposHabitacion}" th:value="${t}" th:text="${t}"
										th:selected="${t == tipoHabitacionSeleccionada}"></option>
								</select>
							</div>
							
							<div class="mb-3">
								<!-- data-tipo guarda el tipo de plan de comida en el html para poder leerlo después desde javascript -->
							    <label class="form-label small text-uppercase text-secondary">Plan de comida</label>
							    <select name="planComidaId" class="form-select rounded-0" required>
							        <option value="" disabled th:selected="${planComidaSeleccionado == null}">Seleccione...</option>
							        <option th:each="p : ${planesComida}" th:value="${p.id}" th:text="${p.tipo}"
										th:data-tipo="${p.tipo}"
										th:selected="${p.id == planComidaSeleccionado}"></option>
							    </select>
							</div>

							<div id="resumenPrecio" class="alert alert-secondary small mb-3 d-none"></div>

							<div class="d-grid gap-2">
								<button type="submit"
									th:class="${#authorization.expression('hasRole(''ADMIN'')')} ? 'btn btn-primary rounded-0 text-uppercase' : 'btn btn-dark rounded-0 text-uppercase'"
									style="letter-spacing:.05em">Confirmar reserva</button>
								<a sec:authorize="hasRole('USER')" href="/" class="btn btn-outline-secondary rounded-0">Cancelar</a>
								<a sec:authorize="hasRole('ADMIN')" href="/admin/reservas" class="btn btn-outline-primary rounded-0">Cancelar</a>
							</div>
						</form>

						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOSPEDIUM - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-black">

    <div class="container-fluid p-0 vh-100 d-flex align-items-center justify-content-start ps-5 position-relative"
         th:style="'background-image: url(' + @{/img/fondologin.png} + '); background-size: cover; background-position: center;'">

        <div class="position-absolute top-0 start-0 w-100 h-100 bg-dark opacity-50"></div>

        <div class="col-lg-3 col-md-5 col-sm-8 col-10 ms-5 position-relative z-1">

            <div class="bg-dark bg-opacity-75 border border-secondary rounded-4 p-5 text-white">

                <div class="mb-4">
                    <p class="text-white-50 text-uppercase small fw-semibold mb-1">Bienvenido a</p>
                    <h1 class="fw-bold text-uppercase h3">HOSPEDIUM</h1>
                    <p class="text-white-50 small">Inicia sesión o crea una cuenta</p>
                </div>

                <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
                    Usuario o contraseña incorrectos.
                </div>

                <form th:action="@{/login}" method="post" class="d-grid gap-3">

                    <div>
                        <label for="username" class="form-label small fw-semibold text-uppercase text-white-50">Usuario</label>
                        <input type="text" id="username" name="username"
                               class="form-control form-control-lg bg-dark border-secondary text-white rounded-3"
                               placeholder="Tu nombre de usuario" required>
                    </div>

                    <div>
                        <label for="password" class="form-label small fw-semibold text-uppercase text-white-50">Contraseña</label>
                        <input type="password" id="password" name="password"
                               class="form-control form-control-lg bg-dark border-secondary text-white rounded-3"
                               placeholder="Tu contraseña" required>
                    </div>

                    <button type="submit" class="btn btn-light btn-lg rounded-3 py-3 mt-2 fw-semibold small">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
                    </button>

                </form>

                <div class="d-flex align-items-center gap-2 my-3">
                    <hr class="flex-grow-1 border-secondary">
                    <span class="text-white-50 small">o</span>
                    <hr class="flex-grow-1 border-secondary">
                </div>

                <a th:href="@{/registro}" class="btn btn-outline-light btn-lg rounded-3 py-3 w-100 fw-semibold small">
                    Crear cuenta
                </a>


            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

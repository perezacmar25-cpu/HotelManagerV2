<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOSPEDIUM - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-black">

    <div class="container-fluid p-0 vh-100 d-flex align-items-center justify-content-center">

        <div class="row g-0 w-75 shadow-lg overflow-hidden border border-secondary">
            <div class="col-lg-8 d-none d-lg-block position-relative">
                <img th:src="@{/img/portadalogin.jpg}" alt="Hospedium"
                     class="w-100 h-100 object-fit-cover" style="min-height: 700px;">
                <div class="position-absolute bottom-0 start-0 w-100 p-5"
                     style="background: linear-gradient(transparent, rgba(0,0,0,0.7));">
                    <h2 class="text-white fw-bold">Hospedium</h2>
                </div>
            </div>

            <div class="col-lg-4 d-flex flex-column justify-content-between p-5 text-center bg-white">

                <div class="mt-4">
                    <p class="text-muted text-uppercase small fw-semibold mb-1">Bienvenido a</p>
                    <h1 class="fw-bold text-uppercase h3">HOSPEDIUM</h1>
                    <p class="text-muted small">Inicia sesión o crea una cuenta</p>
                </div>

                <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
                    Usuario o contraseña incorrectos.
                </div>

                <form th:action="@{/login}" method="post" class="d-grid gap-3">

                    <div class="text-start">
                        <label for="username" class="form-label small fw-semibold text-uppercase text-muted">Usuario</label>
                        <input type="text" id="username" name="username"
                               class="form-control form-control-lg rounded-0 border-0 border-bottom"
                               placeholder="Tu nombre de usuario" required>
                    </div>

                    <div class="text-start">
                        <label for="password" class="form-label small fw-semibold text-uppercase text-muted">Contraseña</label>
                        <input type="password" id="password" name="password"
                               class="form-control form-control-lg rounded-0 border-0 border-bottom"
                               placeholder="Tu contraseña" required>
                    </div>

                    <button type="submit" class="btn btn-dark btn-lg rounded-0 py-3 mt-3 text-uppercase fw-semibold small tracking-wide">
                        Iniciar sesión
                    </button>

                </form>

                <div class="d-flex align-items-center gap-2 my-2">
                    <hr class="flex-grow-1">
                    <span class="text-muted small">o</span>
                    <hr class="flex-grow-1">
                </div>

                <a th:href="@{/registro}" class="btn btn-outline-dark btn-lg rounded-0 py-3 text-uppercase fw-semibold small">
                    Crear cuenta
                </a>

                <div class="mb-4">
                    <div class="d-flex justify-content-center gap-4 mb-2 mt-4">
                        <i class="bi bi-instagram fs-5 text-muted"></i>
                        <i class="bi bi-facebook fs-5 text-muted"></i>
                        <i class="bi bi-twitter-x fs-5 text-muted"></i>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOSPEDIUM - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body class="login-page">

	
	<div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="login-hero">
        <section class="login-intro">
            <a th:href="@{/}" class="login-brand">HOSPEDIUM</a>
            <p class="login-kicker">Tu estancia, a un paso</p>
            <h1>Bienvenido de nuevo.</h1>
            <p>Accede a tus reservas y prepara tu próxima escapada.</p>
        </section>
        <section class="login-card" aria-labelledby="login-title">

        <div class="login-form-wrapper">

                <div class="login-card__heading">
                    <p class="text-uppercase small fw-semibold mb-1">Área de clientes</p>
                    <h2 id="login-title">Iniciar sesión</h2>
                    <p class="text-white-50 small">Inicia sesión o crea una cuenta</p>
                </div>

                <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
                    Usuario o contraseña incorrectos.
                </div>

                <form th:action="@{/login}" method="post" class="login-form">

                    <div>
                        <label for="username" class="form-label small fw-semibold text-uppercase text-white-50">Usuario</label>
                        <input type="text" id="username" name="username"
                               class="form-control form-control-lg bg-dark border-secondary text-white rounded-3"
                               placeholder="Tu nombre de usuario" required>
                    </div>

                    <div>
                        <label for="password" class="form-label small fw-semibold text-uppercase text-white-50">Contraseña</label>
                        <input type="password" id="password" name="password"
                               class="form-control form-control-lg bg-dark border-secondary text-white rounded-3"
                               placeholder="Tu contraseña" required>
                    </div>

                    <button type="submit" class="btn btn-light w-100 py-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
                    </button>

                </form>

                <div class="login-divider">
                    <span class="text-white-50 small">o</span>
                </div>

                <a th:href="@{/registro}" class="btn btn-outline-light w-100 py-3">
                    Crear cuenta
                </a>
				


        </div>
        </section>
    </main>
</body>
</html>

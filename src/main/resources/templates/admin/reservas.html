<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Reservas</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
	<div class="container py-5">

		<div class="card border-primary-subtle shadow-sm rounded-3 mb-4">
			<div class="card-body p-4 p-lg-5">
				<div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-4">
					<div>
						<h1 class="display-6 fw-light text-primary-emphasis mb-2">Reservas</h1>
						<p class="text-secondary mb-0">Consulta y gestiona las reservas activas del hotel.</p>
					</div>
					<div class="d-flex flex-wrap gap-2">
						<a th:href="@{/reserva/nueva}" class="btn btn-primary px-4">+ Nueva reserva</a>
						<a th:href="@{/admin/admininicio}" class="btn btn-outline-primary px-4">Panel</a>
					</div>
				</div>
			</div>
		</div>

		<div class="card border-primary-subtle shadow-sm rounded-3 overflow-hidden">
			<div class="card-header bg-primary-subtle border-primary-subtle py-3 px-4">
				<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">
					<h2 class="h6 text-uppercase text-primary-emphasis fw-semibold mb-0">Reservas registradas</h2>
					<span
						class="badge bg-white border border-primary-subtle text-primary-emphasis rounded-pill px-3 py-2"
						th:text="${#lists.size(reservas)} + ' registros'">0 registros</span>
				</div>
			</div>
			<div class="table-responsive">
				<table class="table table-hover align-middle mb-0">
					<thead class="table-light">
						<tr>
							<th class="text-uppercase text-secondary small fw-semibold ps-4 py-3">DNI</th>
							<th class="text-uppercase text-secondary small fw-semibold py-3">Fecha inicio</th>
							<th class="text-uppercase text-secondary small fw-semibold py-3">Fecha fin</th>
							<th class="text-uppercase text-secondary small fw-semibold py-3">Precio total</th>
							<th class="text-uppercase text-secondary small fw-semibold py-3">Personas</th>
							<th class="text-uppercase text-secondary small fw-semibold py-3">Servicios</th>
							<th class="text-uppercase text-secondary small fw-semibold py-3">Habitación</th>
							<th class="text-uppercase text-secondary small fw-semibold pe-4 py-3">Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="reserva : ${reservas}">
							<td class="ps-4 fw-semibold text-dark" th:text="${reserva.cliente.dni}"></td>
							<td th:text="${reserva.fechaInicio}"></td>
							<td th:text="${reserva.fechaFin}"></td>
							<td class="fw-semibold text-success" th:text="${reserva.precioTotal + ' €'}"></td>
							<td th:text="${reserva.numeroPersonas}"></td>
							<td>
								<span th:each="reservaServicio : ${reserva.serviciosReservados}"
									class="badge bg-info-subtle border border-info-subtle text-info-emphasis fw-normal rounded-pill me-1 mb-1 px-3 py-2"
									th:text="${reservaServicio.servicio.nombre}"></span>
								<span th:if="${#lists.isEmpty(reserva.serviciosReservados)}" class="text-secondary">Sin
									servicios</span>
							</td>
							<td>
								<span th:each="rh : ${reserva.listadoReservaHab}"
									class="badge bg-primary-subtle border border-primary-subtle text-primary-emphasis fw-normal rounded-pill me-1 px-3 py-2"
									th:text="${rh.habitacion.numero}"></span>
								<span th:if="${#lists.isEmpty(reserva.listadoReservaHab)}" class="text-secondary">Sin
									habitación</span>
							</td>
							<td class="pe-4">
								<div class="d-flex flex-wrap gap-2">
									<a th:href="@{'/admin/editar/reserva/' + ${reserva.id}}"
										class="btn btn-outline-dark btn-sm rounded-0 px-3">Editar</a>
									<a th:href="@{'/admin/' + ${reserva.id} + '/eliminar/reserva'}"
										class="btn btn-outline-danger btn-sm rounded-0 px-3">Eliminar</a>
								</div>
							</td>
							<td>
								<form th:action="@{/admin/{id}/cambiar/estado(id=${reserva.id})}" method="post"
									class="d-flex align-items-center gap-2">

									<select name="estado" class="form-select form-select-sm rounded-pill">
										<option th:each="estado : ${estados}" th:value="${estado}"
											th:selected="${estado == reserva.estadoReserva}" th:text="${estado}">
										</option>
									</select>

									<button type="submit" class="btn btn-sm btn-outline-dark rounded-pill"
										title="Guardar estado">
										<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
											fill="currentColor" class="bi bi-floppy" viewBox="0 0 16 16">
											<path d="M11 2H9v3h2z" />
											<path
												d="M1.5 0h11.586a1.5 1.5 0 0 1 1.06.44l1.415 1.414A1.5 1.5 0 0 1 16 2.914V14.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 14.5v-13A1.5 1.5 0 0 1 1.5 0M1 1.5v13a.5.5 0 0 0 .5.5H2v-4.5A1.5 1.5 0 0 1 3.5 9h9a1.5 1.5 0 0 1 1.5 1.5V15h.5a.5.5 0 0 0 .5-.5V2.914a.5.5 0 0 0-.146-.353l-1.415-1.415A.5.5 0 0 0 13.086 1H13v4.5A1.5 1.5 0 0 1 11.5 7h-7A1.5 1.5 0 0 1 3 5.5V1H1.5a.5.5 0 0 0-.5.5m3 4a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5V1H4zM3 15h10v-4.5a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5z" />
										</svg>
									</button>

								</form>
							</td>
						</tr>

						<tr th:if="${#lists.isEmpty(reservas)}">
							<td colspan="8" class="text-center text-secondary py-5">Sin registros</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

		<div class="mt-4">
			<a th:href="@{/admin/admininicio}" class="btn btn-outline-primary px-4">Volver al panel</a>
		</div>
	</div>
</body>

</html>

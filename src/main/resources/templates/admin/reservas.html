<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Reservas</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
	<div class="container py-5">

		<div class="card border-primary-subtle shadow-sm rounded-3 mb-4">
			<div class="card-body p-4 p-lg-5">
				<div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-4">
					<div>
						<h1 class="display-6 fw-light text-primary-emphasis mb-2">Reservas</h1>
						<p class="text-secondary mb-0">Consulta y gestiona las reservas activas del hotel.</p>
					</div>
					<div class="d-flex flex-wrap gap-2">
						<a th:href="@{/reserva/nueva}" class="btn btn-primary px-4">+ Nueva reserva</a>
						<a th:href="@{/admin/admininicio}" class="btn btn-outline-primary px-4">Panel</a>
					</div>
				</div>
			</div>
		</div>

		<div class="card border-primary-subtle shadow-sm rounded-3 overflow-hidden">
			<div class="card-header bg-primary-subtle border-primary-subtle py-3 px-4">
				<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">
					<h2 class="h6 text-uppercase text-primary-emphasis fw-semibold mb-0">Reservas registradas</h2>
					<span
						class="badge bg-white border border-primary-subtle text-primary-emphasis rounded-pill px-3 py-2"
						th:text="${#lists.size(reservas)} + ' registros'">0 registros</span>
				</div>
			</div>
			<div class="table-responsive">
				<table class="table table-sm table-hover align-middle mb-0">
					<thead class="table-light">
						<tr>
							<th class="text-uppercase text-secondary small fw-semibold ps-4 py-3 text-nowrap">Código</th>
							<th class="text-uppercase text-secondary small fw-semibold py-3 text-nowrap">DNI</th>
							<th class="text-uppercase text-secondary small fw-semibold py-3 text-nowrap">Entrada</th>
							<th class="text-uppercase text-secondary small fw-semibold py-3 text-nowrap">Salida</th>
							<th class="text-uppercase text-secondary small fw-semibold py-3 text-nowrap">Total</th>
							<th class="text-uppercase text-secondary small fw-semibold py-3 text-center text-nowrap">Pers.</th>
							<th class="text-uppercase text-secondary small fw-semibold py-3">Servicios</th>
							<th class="text-uppercase text-secondary small fw-semibold py-3 text-nowrap">Hab.</th>
							<th class="text-uppercase text-secondary small fw-semibold py-3">Plan</th>
							<th class="text-uppercase text-secondary small fw-semibold py-3 text-nowrap">Estado</th>
							<th class="text-uppercase text-secondary small fw-semibold pe-4 py-3 text-nowrap">Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="reserva : ${reservas}">
							<td class="ps-4 fw-semibold text-primary text-nowrap" th:text="${reserva.codigo != null ? reserva.codigo : 'RES-' + reserva.id}"></td>
							<td class="fw-semibold text-dark text-nowrap" th:text="${reserva.cliente?.dni}"></td>
							<td class="text-nowrap" th:text="${reserva.fechaInicio}"></td>
							<td class="text-nowrap" th:text="${reserva.fechaFin}"></td>
							<td class="fw-semibold text-success text-nowrap" th:text="${reserva.precioTotal + ' €'}"></td>
							<td class="text-center" th:text="${reserva.numeroPersonas}"></td>
							<td>
								<span th:each="reservaServicio : ${reserva.serviciosReservados}"
									class="badge bg-info-subtle border border-info-subtle text-info-emphasis fw-normal rounded-pill me-1 mb-1 px-2 py-1"
									th:text="${reservaServicio.servicio.nombre}"></span>
								<span th:if="${#lists.isEmpty(reserva.serviciosReservados)}" class="text-secondary">Sin
									servicios</span>
							</td>
							<td>
								<span th:each="rh : ${reserva.listadoReservaHab}"
									class="badge bg-primary-subtle border border-primary-subtle text-primary-emphasis fw-normal rounded-pill me-1 mb-1 px-2 py-1"
									th:text="${rh.habitacion.numero}"></span>
								<span th:if="${#lists.isEmpty(reserva.listadoReservaHab)}" class="text-secondary">Sin
									habitación</span>
							</td>
							<!--El strings replace es para que no salga por ejemplo pensión_completa, que queda feo-->
							<td>
								<span th:if="${reserva.planComida != null}"
									class="badge bg-warning-subtle border border-warning-subtle text-warning-emphasis fw-normal rounded-pill px-2 py-1 text-wrap"
									th:text="${#strings.replace(reserva.planComida.tipo, '_', ' ')}"></span>
								<span th:if="${reserva.planComida == null}" class="text-secondary">Sin plan</span>
							</td>
							<td>
								<form th:action="@{'/admin/' + ${reserva.id} + '/cambiar/estado'}" method="post" class="d-flex flex-column gap-2">
									<select name="estado" class="form-select form-select-sm">
										<option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}"
											th:selected="${estado == reserva.estadoReserva}"></option>
									</select>
									<button type="submit" class="btn btn-outline-primary btn-sm rounded-0">Cambiar</button>
								</form>
							</td>
							<td class="pe-4">
								<div class="d-grid gap-2">
									<a th:href="@{'/admin/editar/reserva/' + ${reserva.id}}"
										class="btn btn-outline-dark btn-sm rounded-0 px-3">Editar</a>
									<a th:href="@{'/admin/' + ${reserva.id} + '/eliminar/reserva'}"
										class="btn btn-outline-danger btn-sm rounded-0 px-3">Eliminar</a>
								</div>
							</td>
						</tr>

						<tr th:if="${#lists.isEmpty(reservas)}">
							<td colspan="11" class="text-center text-secondary py-5">Sin registros</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

		<div class="mt-4">
			<a th:href="@{/admin/admininicio}" class="btn btn-outline-primary px-4">Volver al panel</a>
		</div>
	</div>
</body>

</html>

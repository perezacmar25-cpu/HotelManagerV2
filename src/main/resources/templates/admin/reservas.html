<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Reservas</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body {
			background: #f8f5f0;
		}
	</style>
</head>

<body>
	<div class="container py-5">

		<div class="d-flex justify-content-between align-items-end mb-5">
			<div>
				<p class="text-uppercase text-secondary small mb-1">Módulo 03</p>
				<h1 class="fw-light mb-0">Reservas</h1>
			</div>
			<div class="d-flex gap-2">
				<a th:href="@{/reserva/nueva}" class="btn btn-dark btn-sm">+ Nueva reserva</a>
				<a th:href="@{/admin/admininicio}" class="btn btn-outline-secondary btn-sm"> Panel</a>
			</div>
		</div>

		<div class="card border-0 shadow-sm">
			<table class="table table-hover align-middle mb-0">
				<thead class="table-light">
					<tr>
						<th class="text-uppercase text-secondary small fw-normal ps-4">DNI</th>
						<th class="text-uppercase text-secondary small fw-normal">Fecha inicio</th>
						<th class="text-uppercase text-secondary small fw-normal">Fecha fin</th>
						<th class="text-uppercase text-secondary small fw-normal">Precio total</th>
						<th class="text-uppercase text-secondary small fw-normal">Personas</th>
						<th class="text-uppercase text-secondary small fw-normal">Servicios</th>
						<th class="text-uppercase text-secondary small fw-normal">Habitación</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="reserva : ${reservas}">
						<td class="ps-4 fw-semibold" th:text="${reserva.cliente.dni}"></td>
						<td th:text="${reserva.fechaInicio}"></td>
						<td th:text="${reserva.fechaFin}"></td>
						<td th:text="${reserva.precioTotal + ' €'}"></td>
						<td th:text="${reserva.numeroPersonas}"></td>
						<td>
							<span th:each="servicio : ${reserva.servicios}"
								class="badge text-bg-secondary fw-normal me-1" th:text="${servicio.nombre}"></span>
							<span th:if="${#lists.isEmpty(reserva.servicios)}" class="text-secondary">—</span>
						</td>
						<td>
							<span th:each="rh : ${reserva.listadoReservaHab}" class="badge text-bg-dark fw-normal me-1"
								th:text="${rh.habitacion.numero}"></span>
							<span th:if="${#lists.isEmpty(reserva.listadoReservaHab)}" class="text-secondary">—</span>
						</td>
						
					</tr>

					<tr th:if="${#lists.isEmpty(reservas)}">
						<td colspan="7" class="text-center text-secondary py-5">Sin registros</td>
					</tr>
				</tbody>
			</table>
		</div>

		<div class="mt-4">
			<a th:href="@{/admin/admininicio}" class="btn btn-outline-secondary btn-sm"> Volver al panel</a>
		</div>
	</div>
</body>

</html>

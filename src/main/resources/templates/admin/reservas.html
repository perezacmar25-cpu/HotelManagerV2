<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<div class="container py-5">

	        <div class="row mb-4 align-items-center">
	            <div class="col">
	                <h2 class="display-6 fw-bold text-dark mb-0">Gestión de Reservas</h2>
	            </div>
	            <div class="col-auto">
					<a th:href="@{/reserva/nueva}" class="btn btn-success btn-lg px-4 shadow-sm">
					        + Nueva reserva
					    </a>
	            </div>
	        </div>

	        <div class="card shadow-sm border-0">
	            <div class="card-body p-0">
	                <div class="table-responsive">
	                    <table class="table table-hover align-middle mb-0">
	                        <thead class="table-dark">
	                            <tr>
									<th class="py-3 px-4">DNI</th>
	                                <th class="py-3 px-4">Fecha inicio</th>
	                                <th class="py-3">Fecha fin</th>
	                                <th class="py-3">Precio total</th>
	                                <th class="py-3">Número de personas</th>
	                            </tr>
	                        </thead>
	                        <tbody class="table-group-divider">
	                            <tr th:each="reserva : ${reservas}">
	                                <td class="px-4 fw-bold text-secondary" th:text="${reserva.cliente.dni}"></td>
	                                <td th:text="${reserva.fechaInicio}"></td>
	                                <td th:text="${reserva.fechaFin}"></td>
	                                <td th:text="${reserva.precioTotal}"></td>
									<td th:text="${reserva.numeroPersonas}"></td>
	                            </tr>
	                            <tr th:if="${#lists.isEmpty(reservas)}">
	                                <td colspan="4" class="text-center py-5 text-muted italic">
	                                    No se han encontrado registros de reservas.
	                                </td>
	                            </tr>
	                        </tbody>
	                    </table>
	                </div>
	            </div>
	        </div>
	        
	    </div>


</body>

</html>

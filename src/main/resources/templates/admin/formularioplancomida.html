<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Editar Plan de Comida</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<body class="bg-light">
	<div class="container py-5">
		<div class="card border-success-subtle shadow-sm rounded-3 mb-4">
			<div class="card-body p-4 p-lg-5">
				<h1 class="display-6 fw-light text-success-emphasis mb-4">Editar Plan de Comida</h1>


				<form th:object="${plan}" th:action="@{/admin/editar/plancomida/{id}(id=${plan.id})}" method="post">

					<input type="hidden" th:field="*{id}" />

					<div class="mb-3">
						<label for="tipo" class="form-label">Tipo</label>
						<select th:field="*{tipo}" class="form-select" id="tipo" required>
							<option th:each="t : ${tipos}" th:value="${t}" th:text="${t}" th:selected="${t == plan.tipo}"></option>
						</select>
					</div>
					<div class="mb-3">
						<label for="precio" class="form-label">Precio</label>
						<input th:field="*{precio}" type="number" step="0.01" class="form-control" id="precio" placeholder="Ej: 19.99" required>
					</div>
					
					


					<div class="d-flex gap-2 pt-3">
						<button type="submit" class="btn btn-success text-white px-4">Guardar Cambios</button>
						<a th:href="@{/admin/planescomida}" class="btn btn-outline-secondary px-4">Cancelar</a>
					</div>
				</form>
			</div>
		</div>
	</div>

</body>

</html>

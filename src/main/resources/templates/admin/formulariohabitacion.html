<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Formulario de Habitación</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<div class="container py-5">
		<div class="card border-warning-subtle shadow-sm rounded-3 mb-4">
			<div class="card-body p-4 p-lg-5">
				<h1 class="display-6 fw-light text-warning-emphasis mb-4"
					th:text="${habitacion.numero != 0 ? 'Editar Habitación Nº ' + habitacion.numero : 'Nueva Habitación'}">
					Formulario de Habitación
				</h1>

				<form th:object="${habitacion}" th:action="@{/admin/editar/habitacion/{id}(id=${habitacion.numero})}" method="post">

					<input type="hidden" th:field="*{numero}" />

					<div class="mb-3">
						<label for="tipo" class="form-label">Tipo de Habitación</label>
						<select th:field="*{tipo}" class="form-select" id="tipo" required>
							<option value="Individual">Individual</option>
							<option value="Doble">Doble</option>
							<option value="Suite">Suite</option>
						</select>
					</div>

					<div class="mb-3">
						<label for="precioNoche" class="form-label">Precio por noche (€)</label>
						<input th:field="*{precioNoche}" type="number" class="form-control" id="precioNoche" step="0.01" required>
					</div>

					<div class="d-flex gap-2 pt-3">
						<button type="submit" class="btn btn-warning px-4">Guardar Cambios</button>
						<a th:href="@{/admin/habitaciones}" class="btn btn-outline-secondary px-4">Cancelar</a>
					</div>
				</form>
			</div>
		</div>
	</div>

</body>

</html>

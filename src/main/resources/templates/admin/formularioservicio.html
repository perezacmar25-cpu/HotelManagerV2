<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Editar Servicio</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<div class="container py-5">
		<div class="card border-info-subtle shadow-sm rounded-3 mb-4">
			<div class="card-body p-4 p-lg-5">
				<h1 class="display-6 fw-light text-info-emphasis mb-4"
					th:text="'Editar Servicio: ' + ${servicio.nombre}">
					Editar Servicio
				</h1>
				<form th:object="${servicio}" th:action="@{/admin/editar/servicio/{id}(id=${servicio.id})}" method="post">
					<input type="hidden" th:field="*{id}" />
					<div class="mb-3">
						<label for="nombre" class="form-label">Nombre</label>
						<input th:field="*{nombre}" type="text" class="form-control" id="nombre" placeholder="Ej: Spa, Minibar..." required>
					</div>
					<div class="mb-3">
						<label for="precio" class="form-label">Precio (€)</label>
						<input th:field="*{precio}" type="number" class="form-control" id="precio" step="0.01" min="0" required>
					</div>
					<div class="mb-3">
						<label for="imagen" class="form-label">Imagen (URL)</label>
						<input th:field="*{imagen}" type="text" class="form-control" id="imagen" placeholder="URL de imagen">
					</div>
					<div class="d-flex gap-2 pt-3">
						<button type="submit" class="btn btn-info text-white px-4">Guardar Cambios</button>
						<a th:href="@{/admin/servicios}" class="btn btn-outline-secondary px-4">Cancelar</a>
					</div>
				</form>
			</div>
		</div>
	</div>
</body>
</html>

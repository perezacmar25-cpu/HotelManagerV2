<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Clientes</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
	<div class="container py-5">

		<div class="card border-success-subtle shadow-sm rounded-3 mb-4">
			<div class="card-body p-4 p-lg-5">
				<div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-4">
					<div>

						<h1 class="display-6 fw-light text-success-emphasis mb-2">Clientes</h1>
						<p class="text-secondary mb-0">Consulta los datos de contacto de los clientes registrados.</p>
					</div>
					<div class="d-flex flex-wrap gap-2">
						<a th:href="@{/admin/nuevo/cliente}" class="btn btn-success px-4">+ Nuevo cliente</a>
						<a th:href="@{/admin/admininicio}" class="btn btn-outline-success px-4">Panel</a>
					</div>
				</div>
			</div>
		</div>

		<div class="card border-success-subtle shadow-sm rounded-3 overflow-hidden">
			<div class="card-header bg-success-subtle border-success-subtle py-3 px-4">
				<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">
					<h2 class="h6 text-uppercase text-success-emphasis fw-semibold mb-0">Clientes registrados</h2>
					<span
						class="badge bg-white border border-success-subtle text-success-emphasis rounded-pill px-3 py-2"
						th:text="${#lists.size(clientes)} + ' registros'">0 registros</span>
				</div>
			</div>
			<div class="table-responsive">
				<table class="table table-hover align-middle mb-0">
					<thead class="table-light">
						<tr>
							<th class="text-uppercase text-secondary small fw-semibold ps-4 py-3">DNI</th>
							<th class="text-uppercase text-secondary small fw-semibold py-3">Nombre</th>
							<th class="text-uppercase text-secondary small fw-semibold py-3">Email</th>
							<th class="text-uppercase text-secondary small fw-semibold py-3">Teléfono</th>
							<th class="text-uppercase text-secondary small fw-semibold pe-4 py-3">Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="cliente : ${clientes}">
							<td class="ps-4 fw-semibold text-dark" th:text="${cliente.dni}"></td>
							<td th:text="${cliente.nombre}"></td>
							<td>
								<span
									class="badge bg-success-subtle border border-success-subtle text-success-emphasis fw-normal rounded-pill px-3 py-2"
									th:text="${cliente.email}"></span>
							</td>
							<td th:text="${cliente.telefono}"></td>
							<td>
								<a th:href="@{'/admin/' + ${cliente.dni} + '/editar/cliente'}"
									class="btn btn-outline-primary btn-sm px-3 me-2">Editar</a>
								<a th:href="@{'/admin/' + ${cliente.dni} + '/eliminar/cliente'}"
									class="btn btn-outline-danger btn-sm px-3">Eliminar</a>
							</td>

						</tr>
						<tr th:if="${#lists.isEmpty(clientes)}">
							<td colspan="5" class="text-center text-secondary py-5">Sin registros</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

		<div class="mt-4">
			<a th:href="@{/admin/admininicio}" class="btn btn-outline-success px-4">Volver al panel</a>
		</div>
	</div>
</body>

</html>

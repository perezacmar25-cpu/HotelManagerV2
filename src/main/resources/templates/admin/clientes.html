<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f5f0; }
    </style>
</head>
<body>
    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-end mb-5">
            <div>
                <p class="text-uppercase text-secondary small mb-1">Módulo 01</p>
                <h1 class="fw-light mb-0">Clientes</h1>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/registro}" class="btn btn-dark btn-sm">+ Nuevo cliente</a>
                <a th:href="@{/admin/admininicio}" class="btn btn-outline-secondary btn-sm">← Panel</a>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="text-uppercase text-secondary small fw-normal ps-4">DNI</th>
                        <th class="text-uppercase text-secondary small fw-normal">Nombre</th>
                        <th class="text-uppercase text-secondary small fw-normal">Email</th>
                        <th class="text-uppercase text-secondary small fw-normal">Teléfono</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cliente : ${clientes}">
                        <td class="ps-4 fw-semibold" th:text="${cliente.dni}"></td>
                        <td th:text="${cliente.nombre}"></td>
                        <td th:text="${cliente.email}"></td>
                        <td th:text="${cliente.telefono}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(clientes)}">
                        <td colspan="4" class="text-center text-secondary py-5">Sin registros</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-4">
            <a th:href="@{/admin/admininicio}" class="btn btn-outline-secondary btn-sm">← Volver al panel</a>
        </div>
    </div>
</body>
</html>

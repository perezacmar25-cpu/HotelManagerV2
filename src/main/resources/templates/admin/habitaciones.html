<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Habitaciones</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
	<div class="container py-5">

		<div class="card border-warning-subtle shadow-sm rounded-3 mb-4">
			<div class="card-body p-4 p-lg-5">
				<div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-4">
					<div>

						<h1 class="display-6 fw-light text-warning-emphasis mb-2">Habitaciones</h1>
						<p class="text-secondary mb-0">Revisa disponibilidad, precios y estado de cada habitación.</p>
					</div>
					<a th:href="@{/admin/admininicio}" class="btn btn-outline-warning px-4">Panel</a>
				</div>
			</div>
		</div>

		<div class="card border-warning-subtle shadow-sm rounded-3 mb-4">
			<div class="card-body p-4">
				<h2 class="h6 text-uppercase text-warning-emphasis fw-semibold mb-3">Agregar habitación</h2>
				<form th:action="@{/admin/agregar/habitacion}" method="get" class="row g-3">
					<div class="col-md-8">
						<label class="form-label">Tipo</label>
						<select name="tipo" class="form-select" required>
							<option value="">Elige un tipo</option>
							<option value="Individual">Individual</option>
							<option value="Doble">Doble</option>
							<option value="Suite">Suite</option>
						</select>
					</div>
					<div class="col-md-4 d-flex align-items-end">
						<button type="submit" class="btn btn-warning w-100">Agregar</button>
					</div>
				</form>
			</div>
		</div>

		<div class="card border-warning-subtle shadow-sm rounded-3 overflow-hidden">
			<div class="card-header bg-warning-subtle border-warning-subtle py-3 px-4">
				<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">
					<h2 class="h6 text-uppercase text-warning-emphasis fw-semibold mb-0">Habitaciones registradas</h2>
					<span
						class="badge bg-white border border-warning-subtle text-warning-emphasis rounded-pill px-3 py-2"
						th:text="${#lists.size(habitaciones)} + ' registros'">0 registros</span>
				</div>
			</div>
			<div class="table-responsive">
				<table class="table table-hover align-middle mb-0">
					<thead class="table-light">
						<tr>
							<th class="text-uppercase text-secondary small fw-semibold ps-4 py-3">Nº</th>
							<th class="text-uppercase text-secondary small fw-semibold py-3">Tipo</th>
							<th class="text-uppercase text-secondary small fw-semibold py-3">Precio / noche</th>
							<th class="text-uppercase text-secondary small fw-semibold py-3">Estado</th>
							<th class="text-uppercase text-secondary small fw-semibold pe-4 py-3">Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="hab : ${habitaciones}">
							<td class="ps-4 fw-semibold text-dark" th:text="${hab.numero}"></td>
							<td th:text="${hab.tipo}"></td>
							<td class="fw-semibold text-success" th:text="${hab.precioNoche + ' €'}"></td>
							<td>
								<span th:if="${hab.disponible}"
									class="badge text-bg-success fw-normal rounded-pill px-3 py-2">Disponible</span>
								<span th:if="${!hab.disponible}"
									class="badge text-bg-danger fw-normal rounded-pill px-3 py-2">Ocupada</span>
							</td>
							<td class="pe-4">
								<a th:href="@{'/admin/editar/habitacion/' + ${hab.numero}}"
									class="btn btn-outline-warning btn-sm px-3">Editar</a>
								<a th:href="@{'/admin/' + ${hab.numero} + '/eliminar/habitaciones'}"
									class="btn btn-outline-danger btn-sm px-3">Eliminar</a>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(habitaciones)}">
							<td colspan="5" class="text-center text-secondary py-5">Sin registros</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

		<div class="mt-4">
			<a th:href="@{/admin/admininicio}" class="btn btn-outline-warning px-4">Volver al panel</a>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

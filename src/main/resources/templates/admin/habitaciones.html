<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habitaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f5f0; }
    </style>
</head>
<body>
    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-end mb-5">
            <div>
                <p class="text-uppercase text-secondary small mb-1">Módulo 02</p>
                <h1 class="fw-light mb-0">Habitaciones</h1>
            </div>
            <a th:href="@{/admin/admininicio}" class="btn btn-outline-secondary btn-sm">← Panel</a>
        </div>

        <div class="card border-0 shadow-sm">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="text-uppercase text-secondary small fw-normal ps-4">Nº</th>
                        <th class="text-uppercase text-secondary small fw-normal">Tipo</th>
                        <th class="text-uppercase text-secondary small fw-normal">Precio / noche</th>
                        <th class="text-uppercase text-secondary small fw-normal">Estado</th>
                        <th class="text-uppercase text-secondary small fw-normal">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="hab : ${habitaciones}">
                        <td class="ps-4 fw-semibold" th:text="${hab.numero}"></td>
                        <td th:text="${hab.tipo}"></td>
                        <td th:text="${hab.precioNoche + ' €'}"></td>
                        <td>
                            <span th:if="${hab.disponible}" class="badge text-bg-success fw-normal">Disponible</span>
                            <span th:if="${!hab.disponible}" class="badge text-bg-danger fw-normal">Ocupada</span>
                        </td>
                        <td>
                            <a th:href="@{'/admin/' + ${hab.numero} + '/eliminar/habitaciones'}"
                               class="btn btn-outline-danger btn-sm">Eliminar</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(habitaciones)}">
                        <td colspan="5" class="text-center text-secondary py-5">Sin registros</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-4">
            <a th:href="@{/admin/admininicio}" class="btn btn-outline-secondary btn-sm">← Volver al panel</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

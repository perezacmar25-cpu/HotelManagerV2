<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Habitaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <div class="row mb-4 align-items-center">
            <div class="col">
                <h2 class="display-6 fw-bold text-dark mb-0">Gestión de Habitaciones</h2>
            </div>
            <div class="col-auto">
                <a th:href="@{/admin/admininicio}" class="btn btn-secondary btn-lg px-4">Volver</a>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
								<th class="py-3 px-4">Nº</th>
                                <th class="py-3 px-4">Tipo</th>
                                <th class="py-3">Precio/noche</th>
                                <th class="py-3">Disponible</th>
                                <th class="py-3">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="table-group-divider">
                            <tr th:each="hab : ${habitaciones}">
								<td class="px-4 fw-bold" th:text="${hab.numero}"></td>
                                <td class="px-4 fw-bold" th:text="${hab.tipo}"></td>
                                <td th:text="${hab.precioNoche + '€'}"></td>
                                <td>
                                    <span th:if="${hab.disponible}" class="badge bg-success">Disponible</span>
                                    <span th:if="${!hab.disponible}" class="badge bg-danger">Ocupada</span>
                                </td>
                                <td>
                                    <a th:href="@{'/admin/' + ${hab.numero} + '/eliminar/habitaciones'}"
                                        class="btn btn-danger btn-sm rounded-0">Eliminar</a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(habitaciones)}">
                                <td colspan="4" class="text-center py-5 text-muted">
                                    No hay habitaciones registradas.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="text-center mt-4" sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/reserva/nueva}" class="btn btn-dark btn-lg rounded-0 px-5 py-3 text-uppercase fw-bold">
                ¡Reserva ya!
            </a>
        </div>

		<div class="text-center mt-3">
			<a th:href="@{/admin/admininicio}" class="btn btn-outline-dark rounded-0 px-4">Volver al panel</a>
		</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

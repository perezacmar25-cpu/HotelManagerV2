<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Habitaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">

        <div class="row mb-4 align-items-center">
            <div class="col">
                <h2 class="display-6 fw-bold text-dark mb-0">Gestión de Habitaciones</h2>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th class="py-3 px-4">Número</th>
                                <th class="py-3 px-4">Tipo</th>
                                <th class="py-3">Precio / noche</th>
                                <th class="py-3">Estado</th>
                            </tr>
                        </thead>
                        <tbody class="table-group-divider">
                            <tr th:each="habitacion : ${habitaciones}">
                                <td class="px-4 fw-bold text-secondary" th:text="${habitacion.numero}"></td>
                                <td th:text="${habitacion.tipo}"></td>
                                <td th:text="${habitacion.precioNoche} + ' €'"></td>
                                <td>
                                    <span th:if="${habitacion.disponible}" class="badge bg-success">Disponible</span>
                                    <span th:unless="${habitacion.disponible}" class="badge bg-danger">No disponible</span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(habitaciones)}">
                                <td colspan="4" class="text-center py-5 text-muted">
                                    No se han encontrado habitaciones.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</body>
</html>

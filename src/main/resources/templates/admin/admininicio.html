<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <h1 class="display-4 fw-bold text-center mb-5">Bienvenido al Panel de Administración</h1>
        <div class="row g-4">
            <div class="col-md-6 col-lg-4">
                <a th:href="@{/admin/clientes}" class="text-decoration-none">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <i class="bi bi-people-fill display-1 text-primary mb-3"></i>
                            <h5 class="card-title fw-bold text-dark">Gestión de Clientes</h5>
                            <p class="card-text text-muted text-center">Administra la información de tus clientes</p>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-6 col-lg-4">
                <a th:href="@{/admin/habitaciones}" class="text-decoration-none">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <i class="bi bi-box-seam display-1 text-success mb-3"></i>
                            <h5 class="card-title fw-bold text-dark">Gestión de Habitaciones</h5>
                            <p class="card-text text-muted text-center">Administra la información de tus habitaciones</p>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-6 col-lg-4">
                <a th:href="@{/admin/reservas}" class="text-decoration-none">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <i class="bi bi-calendar-check-fill display-1 text-warning mb-3"></i>
                            <h5 class="card-title fw-bold text-dark">Gestión de Reservas</h5>
                            <p class="card-text text-muted text-center">Administra la información de tus reservas</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
		<div class="text-center mt-3">
		           <a th:href="@{/}" class="btn btn-outline-dark rounded-0 px-4">Volver al panel</a>
		       </div>
    </div>

</body>
</html>
</body>
</html>

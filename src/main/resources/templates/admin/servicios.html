<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Servicios</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
	<div class="container py-5">

		<div class="card border-info-subtle shadow-sm rounded-3 mb-4">
			<div class="card-body p-4 p-lg-5">
				<div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-4">
					<div>

						<h1 class="display-6 fw-light text-info-emphasis mb-2">Servicios</h1>
						<p class="text-secondary mb-0">Consulta y gestiona los servicios disponibles del hotel.</p>
					</div>
					<div class="d-flex flex-wrap gap-2">
						<a th:href="@{/admin/admininicio}" class="btn btn-outline-info px-4">Panel</a>
					</div>
				</div>
			</div>
		</div>

		<div class="card border-info-subtle shadow-sm rounded-3 overflow-hidden">
			<div class="card-header bg-info-subtle border-info-subtle py-3 px-4">
				<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">
					<h2 class="h6 text-uppercase text-info-emphasis fw-semibold mb-0">Servicios registrados</h2>
					<span
						class="badge bg-white border border-info-subtle text-info-emphasis rounded-pill px-3 py-2"
						th:text="${#lists.size(servicios)} + ' registros'">0 registros</span>
				</div>
			</div>
			<div class="table-responsive">
				<table class="table table-hover align-middle mb-0">
					<thead class="table-light">
						<tr>
							<th class="text-uppercase text-secondary small fw-semibold ps-4 py-3">ID</th>
							<th class="text-uppercase text-secondary small fw-semibold py-3">Nombre</th>
							<th class="text-uppercase text-secondary small fw-semibold py-3">Precio</th>
							<th class="text-uppercase text-secondary small fw-semibold py-3">Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="servicio : ${servicios}">
							<td class="ps-4 fw-semibold text-dark" th:text="${servicio.id}"></td>
							<td th:text="${servicio.nombre}"></td>
							<td class="fw-semibold text-success" th:text="${servicio.precio + ' €'}"></td>
						</tr>
						<tr th:if="${#lists.isEmpty(servicios)}">
							<td colspan="4" class="text-center text-secondary py-5">Sin registros</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

		<div class="mt-4">
			<a th:href="@{/admin/admininicio}" class="btn btn-outline-info px-4">Volver al panel</a>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
